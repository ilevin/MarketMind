<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ current_user.csrf_token }}">
  <title>修改密码 - 股票与 ETF 行情看板</title>
  <link rel="stylesheet" href="/static/style.css?v={{ app_version }}">
</head>
<body data-page="change-password">
  <header class="topbar">
    <h1>股票与 ETF 行情看板</h1>
    <nav class="user-nav">
      <span class="current-user">{{ current_user.username }}（{{ "管理员" if current_user.role == "admin" else "用户" }}）</span>
      <a href="/">行情首页</a>
      {% if current_user.role == "admin" %}<a href="/admin/data">数据管理</a><a href="/admin/users">用户管理</a><a href="/admin/status">系统状态</a>{% endif %}
      <a href="#" id="logout-link">退出登录</a>
    </nav>
  </header>

  <main class="container">
    <section class="panel">
      <h2>修改密码</h2>
      <form id="change-password-form" class="login-fields" autocomplete="on">
        <label for="old-password">原密码</label>
        <input id="old-password" type="password" required autocomplete="current-password">
        <label for="new-password">新密码（至少 8 位）</label>
        <input id="new-password" type="password" required autocomplete="new-password">
        <label for="new-password2">确认新密码</label>
        <input id="new-password2" type="password" required autocomplete="new-password">
        <p id="cp-message" class="message hidden"></p>
        <button type="submit">保存</button>
      </form>
      <p class="muted">修改成功后需要重新登录。</p>
    </section>
  </main>
  <script src="/static/app.js?v={{ app_version }}"></script>
</body>
</html>
