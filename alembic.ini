# Alembic 配置（v0.03）。
# sqlalchemy.url 故意不在此设置：由 alembic/env.py 从应用配置（config.yaml -> database.url）
# 读取，与运行时同源；测试经 programmatic API 以 set_main_option("sqlalchemy.url") 注入。
[alembic]
# %(here)s = ini 所在目录：任意 CWD（容器、升级演练临时目录）均可执行
script_location = %(here)s/alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
