database:
  url: "duckdb:///./data/marketmind.duckdb"

quote:
  refresh_seconds: 60
  stale_seconds: 180

tushare:
  token: "YOUR_TUSHARE_TOKEN"

providers:
  quote:
    cn_stock: akshare
    cn_etf: tencent
    hk_stock: tencent
    hk_etf: tencent
    cn_index: tencent
    hk_index: tencent

  fundamental:
    cn_stock: tushare

  # A 股历史行情数据源（a-share-historical-data v0.3.0；etf-data-module v0.4.2 扩展 ETF）
  history:
    market_data: tushare
    # ETF 数据源选源（etf-data-module v0.4.2）
    etf_daily: eastmoney
    etf_adj_factor: tushare

  # 第三方数据源超时（秒）：可按线上实际耗时调整；缺省时使用默认值
  timeout:
    tencent: 8
    akshare: 45
    tushare: 15

logging:
  level: INFO

# A 股历史数据同步（v0.3.0，技术方案 §57；etf-data-module v0.4.2 扩展 ETF）：全部字段可省略，缺省如下
history:
  # 总开关：false 时不启动历史同步 Job（不影响已有估值/行情功能）
  enabled: true
  # 历史数据起点（首个回填交易日 >= 该日期）
  start_date: "2010-01-01"
  # 每日统一调度时间（Asia/Shanghai，含周末——不产生虚假交易日）
  schedule_time: "20:30"
  # 启动时发现任一数据集落后目标即自动触发一次补齐
  startup_catchup: true

  # 单只股票×单数据集单任务的额外重试次数（总尝试次数 = max_retries + 1，默认 4 次）
  # 退避序列约 5/10/20 秒（指数退避 + 0.8~1.2 抖动，上限 300 秒）
  max_retries: 3
  # [deprecated] 旧字段：单 dataset×单交易日最多尝试次数
  # 兼容保留，将在后续版本移除；仅配置 max_attempts 时自动换算为 max_retries = max_attempts - 1
  # 若两者同时配置，以 max_retries 为准
  # max_attempts: 10
  backoff_initial_seconds: 5
  backoff_max_seconds: 300
  jitter_ratio: 0.2

  # Tushare 全局请求节奏（对所有 Tushare Provider 生效）
  request_min_interval_seconds: 0.6
  # stock_basic 接口限额更严格（>= 1.25 秒/请求）
  stock_basic_min_interval_seconds: 1.25

  # 主档刷新周期：证券主档 24 小时；公司资料/历史名称 7 天
  stock_basic_refresh_hours: 24
  master_refresh_days: 7

  # ETF 数据同步配置（etf-data-module v0.4.2）
  etf_enabled: true
  # 东财 ETF 接口请求节奏（秒/请求，覆盖 fund_etf_hist_em 与 fund_etf_category_sina）
  etf_request_min_interval_seconds: 0.5
  # ETF universe 刷新周期（小时）
  etf_universe_refresh_hours: 24

  # 各日级数据集可用时间 cutoff（北京时间；moneyflow 为保守默认，非官方承诺）
  availability:
    adj_factor: "09:30"
    daily: "16:30"
    daily_basic: "17:30"
    moneyflow: "20:30"
    # ETF 数据集可用时间（etf-data-module v0.4.2）
    etf_daily: "16:30"
    etf_adj_factor: "09:30"

# 多用户认证（multi-user-auth v0.2.0）：全部字段可省略，缺省如下
auth:
  session:
    # 登录 Session 有效期（天），到期需重新登录
    ttl_days: 7
    # HTTPS 部署时必须置 true（Cookie 仅经加密通道发送）；本地 http 调试保持 false
    cookie_secure: false
