{% set nav_section = "market" %}
{% set nav_item = "标签管理" %}
{% set page_id = "tags" %}
{% set page_title = "标签管理" %}
{% extends "base.html" %}

{% block content %}
    <section class="panel">
      <h2>标签</h2>
      <form id="add-tag-form" class="add-form">
        <input type="text" id="tag-name-input" placeholder="标签名称，如 高股息、科技" required maxlength="50">
        <button type="submit">新增标签</button>
      </form>
      <p id="tag-message" class="message hidden"></p>
      <table class="table" id="tags-table">
        <thead>
          <tr>
            <th>标签名称</th><th class="right">使用数量</th><th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p id="tags-empty" class="empty hidden">还没有标签，先创建一个，再到自选管理页关联股票 / ETF。</p>
    </section>
{% endblock %}
